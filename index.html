<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Goal Tracker</h1>
      <p class="subtitle">Set goals, track objectives, and achieve success</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('goals')">Goals</button>
      <button class="tab" onclick="switchTab('todo')">Today's To-Do</button>
      <button class="tab" onclick="switchTab('calendar')">Calendar</button>
      <button class="tab" onclick="switchTab('archive')">Archive</button>
    </div>

    <!-- GOALS TAB -->
    <div id="goals-tab" class="tab-content active">
      <div class="add-goal-section collapsed" id="addGoalSection">
        <div class="add-goal-header" onclick="toggleAddGoalSection()">
          <h2>+ Create New Goal</h2>
          <span class="expand-icon">&#9660;</span>
        </div>
        <div class="add-goal-content">
          <form id="goalForm">
            <div class="form-group">
              <label for="goalTitle">Goal Title</label>
              <input type="text" id="goalTitle" required placeholder="e.g., Launch my online business">
            </div>

            <div class="form-group">
              <label for="goalDeadline">Deadline (Optional)</label>
              <input type="date" id="goalDeadline">
            </div>

            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="isBooleanGoal" onchange="toggleObjectivesSection()">
                <span>Simple Yes/No Goal (no objectives needed)</span>
              </label>
            </div>

            <div class="form-group" id="objectivesFormGroup">
              <label>Objectives (Optional)</label>
              <div id="objectivesList" class="objectives-list"></div>
              <button type="button" class="btn btn-secondary" onclick="addObjectiveInput()">+ Add Objective</button>
            </div>

            <button type="submit" class="btn btn-primary">Create Goal</button>
          </form>
        </div>
      </div>

      <div id="goalsContainer"></div>
    </div>

    <!-- TODAY'S TO-DO TAB -->
    <div id="todo-tab" class="tab-content">
      <div class="daily-planner">
        <h2>To-Do List</h2>

        <div class="planner-nav">
          <button onclick="changePlannerDay(-1)" aria-label="Previous day">&#8249;</button>
          <span id="plannerDate"></span>
          <button onclick="changePlannerDay(1)" aria-label="Next day">&#8250;</button>
          <button id="plannerToday" class="planner-today" onclick="goToToday()">Today</button>
        </div>

        <div class="planner-section">
          <h3>Tasks</h3>
          <div class="daily-task-list" id="dailyTaskList"></div>
        </div>

        <div class="planner-section">
          <h3>Add Quick Task</h3>
          <div class="quick-task-row">
            <input type="text" id="quickTaskInput" placeholder="Add a task not related to any goal...">
            <button class="btn btn-primary" onclick="addQuickTask()">Add</button>
          </div>
        </div>

        <div class="planner-section">
          <h3>Add from Goals</h3>
          <div class="objective-selector" id="objectiveSelector"></div>
        </div>
      </div>
    </div>

    <!-- CALENDAR TAB -->
    <div id="calendar-tab" class="tab-content">
      <div class="calendar-planner-layout">
        <div class="calendar-container">
          <div class="calendar-header">
            <h2>Calendar</h2>
            <div class="calendar-nav">
              <button onclick="changeMonth(-1)">&#8249;</button>
              <span id="currentMonth"></span>
              <button onclick="changeMonth(1)">&#8250;</button>
            </div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="goals-sidebar">
          <h3>Goals by Deadline</h3>
          <div id="goalsSidebarList"></div>
        </div>
      </div>
    </div>

    <!-- ARCHIVE TAB -->
    <div id="archive-tab" class="tab-content">
      <div class="archive-header">
        <h2>Archived Goals</h2>
        <p>Completed goals you've archived</p>
      </div>
      <div id="archivedGoalsContainer"></div>
    </div>

    <!-- Day Details Modal -->
    <div id="dayDetailsModal" class="day-details-modal" onclick="closeDayDetails(event)">
      <div class="day-details-content" onclick="event.stopPropagation()">
        <div class="day-details-header">
          <h3 id="dayDetailsDate"></h3>
          <button class="close-modal" onclick="closeDayDetails()">&times;</button>
        </div>
        <div id="dayDetailsContent"></div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
